<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decor Pot — Scroll Reveal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-snap-type:y mandatory;}       /* snap/freeze at each stop */
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0e0f13;color:#cdd3dc;
  }

  /* fixed full-screen stage (no phone mockup) */
  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#0e0f13;z-index:5;overflow:hidden;
  }
  #player{
    width:100%;height:100%;
    object-fit:cover;         /* fill the screen on phones (portrait) */
    display:block;
  }
  /* on landscape/desktop, show the whole 9:16 design centered instead of cropping */
  @media (min-aspect-ratio:1/1){
    #player{object-fit:contain;}
  }

  /* company logo on the opening (empty) frame — fades out as you scroll */
  .logo{
    position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
    z-index:7;width:216px;max-width:62vw;height:auto;
    pointer-events:none;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.18));
  }

  /* scroll hint */
  .hint{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    z-index:8;font-size:13px;letter-spacing:.5px;color:#c3cad6;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:opacity .4s;text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .hint .chev{width:20px;height:20px;animation:bob 1.4s infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* invisible scroll spacers */
  .snap{height:100svh;scroll-snap-align:start;scroll-snap-stop:always;}
</style>
</head>
<body>
  <div class="stage">
    <img id="player" alt="Decor Pot preview" />
  </div>

  <img class="logo" id="logo" src="logo-stacked.png" alt="Decorpot" />

  <div class="hint" id="hint">
    <span>Scroll to reveal</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>

  <div id="spacers"></div>

  <script>
    /* 4 stops = 3 scrolls: empty -> furniture+TV -> decor+heading+pills -> stats+CTA */
    const STOPS = [1, 120, 192, 240];
    const TOTAL = 240, PAD = 4, DIR = "frames/";
    const src = n => `${DIR}frame_${String(n).padStart(PAD,'0')}.webp`;

    const spacers = document.getElementById('spacers');
    STOPS.forEach(() => {
      const s = document.createElement('div'); s.className = 'snap'; spacers.appendChild(s);
    });

    /* preload every frame for flicker-free scrubbing */
    const frames = [];
    for (let i = 1; i <= TOTAL; i++){ const im = new Image(); im.src = src(i); frames[i] = im; }

    const player = document.getElementById('player');
    const hint   = document.getElementById('hint');
    const logo   = document.getElementById('logo');
    player.src = src(STOPS[0]);
    let shown = STOPS[0];

    const sections = [...document.querySelectorAll('.snap')];
    function render(){
      const vh  = sections[0].getBoundingClientRect().height || window.innerHeight;
      const seg = window.scrollY / vh;
      const i   = Math.min(Math.floor(seg), STOPS.length - 2);
      const f   = Math.min(Math.max(seg - i, 0), 1);
      const frame = Math.round(STOPS[i] + (STOPS[i+1] - STOPS[i]) * f);
      if (frame !== shown){ shown = frame; player.src = frames[frame].src; }
      hint.style.opacity = window.scrollY > 40 ? 0 : 1;
      logo.style.opacity = Math.max(0, 1 - window.scrollY / (vh * 0.5));  // fade out on scroll
    }

    let ticking = false;
    addEventListener('scroll', () => {
      if (!ticking){ requestAnimationFrame(()=>{ render(); ticking=false; }); ticking = true; }
    }, {passive:true});
    addEventListener('resize', render);
    render();
  </script>
</body>
</html>
